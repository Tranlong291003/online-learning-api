services:
  - type: web
    name: online-learning-api
    env: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: DB_SSL
        value: true
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Dịch vụ AI (sinh câu hỏi) — cổng tương thích API OpenAI.
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      # Firebase service account KHÔNG được commit vào repo (đã gitignore).
      # Chỉ cần nếu dùng push notification (FCM); KHÔNG liên quan tới đăng nhập.
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
